spring.application.name=snack-ecommerce
# ============================================
# Database Configuration
# ============================================
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?useSSL=false&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ============================================
# JWT Configuration
# ============================================
# IMPORTANT: Change this to a secure random string of at least 32 characters in production
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION}

# ============================================
# OAuth2 Google Configuration
# ============================================
# Get these credentials from: https://console.cloud.google.com/
# 1. Create a new project
# 2. Go to "Credentials" and create an "OAuth client ID" for Web Application
# 3. Add authorized redirect URI: http://localhost:8080/login/oauth2/code/google
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=profile,email
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.provider.google.authorization-uri=https://accounts.google.com/o/oauth2/v2/auth
spring.security.oauth2.client.provider.google.token-uri=https://www.googleapis.com/oauth2/v4/token
spring.security.oauth2.client.provider.google.user-info-uri=https://www.googleapis.com/oauth2/v1/userinfo
spring.security.oauth2.client.provider.google.user-name-attribute=email

# ============================================
# Server Configuration
# ============================================
server.port=8080
server.servlet.context-path=/

# ============================================
# File Upload Configuration
# ============================================
# Maximum file size for individual files (5MB)
spring.servlet.multipart.max-file-size=50MB
# Maximum request size (100MB for videos)
spring.servlet.multipart.max-request-size=100MB

# ============================================
# Razorpay Payment Gateway Configuration
# ============================================
# Get these credentials from: https://dashboard.razorpay.com/
# Navigate to: Account & Settings > API Keys > Live/Test Keys
# IMPORTANT: In production, use environment variables instead
razorpay.key.id=${RAZORPAY_KEY_ID}
razorpay.key.secret=${RAZORPAY_KEY_SECRET}

# ============================================
# Delhivery Courier Configuration
# ============================================
# Get API token from: https://www.delhivery.com/
# Contact Delhivery for API access and credentials
delhivery.api-token=${DELHIVERY_API_TOKEN}
delhivery.api-url=https://track.delhivery.com/api
frontend.url=${FRONTEND_URL}

# ============================================
# Redis Configuration (Upstash)
# ============================================
spring.redis.url=${REDIS_URL}
spring.redis.password=${REDIS_PASSWORD}
spring.redis.host=${REDIS_HOST}
spring.redis.port=${REDIS_PORT}
spring.redis.timeout=60000ms
spring.redis.jedis.pool.max-active=8
spring.redis.jedis.pool.max-idle=8
spring.redis.jedis.pool.min-idle=0

# ============================================
# Logging
# ============================================
logging.level.root=INFO
logging.level.com.snackecommerce=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.boot.web.servlet.support.ErrorPageFilter=ERROR