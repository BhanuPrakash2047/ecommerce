spring.application.name=snack-ecommerce
# ============================================
# Database Configuration
# ============================================
spring.datasource.url=jdbc:mysql://localhost:3306/snack_ecommerce?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ============================================
# JWT Configuration
# ============================================
# IMPORTANT: Change this to a secure random string of at least 32 characters in production
jwt.secret=yoursecretkeyenretkeyenetkeyenetkeyenetkeyenetkeyenetkeyenretkeyenretkeyenvironmentwithatleast32characters
jwt.expiration=864000000

# ============================================
# OAuth2 Google Configuration
# ============================================
# Get these credentials from: https://console.cloud.google.com/
# 1. Create a new project
# 2. Go to "Credentials" and create an "OAuth client ID" for Web Application


# ============================================
# Logging
# ============================================
logging.level.root=INFO
logging.level.com.snackecommerce=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.boot.web.servlet.support.ErrorPageFilter=ERROR